server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  # Styles inline: Sonner and Radix inject <style>. Scripts stay 'self' only.
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

  # Docker DNS, so nginx starts even when the agent service is not running.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    # Only internal services may present a bearer token (agent → api).
    proxy_set_header Authorization "";
    # Forwarded as-is; the API verifies it (J7), never trusts it blindly.
    proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
  }

  location /agent/ {
    set $agent http://agent:8000;
    proxy_pass $agent;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
    # Model calls can take a while.
    proxy_read_timeout 180s;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-store";
    try_files $uri /index.html;
  }
}
