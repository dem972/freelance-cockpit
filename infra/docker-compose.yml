name: finance-cockpit

# backend:      internal only, db, api and redis have no route to the outside world.
# edge:         web, and cloudflared which dials out to Cloudflare.
# egress:       backup, which uploads to the remote bucket.
# agent-egress: agent services, which call OpenAI and fetch official sources.
networks:
  backend:
    internal: true
  edge: {}
  egress: {}
  agent-egress: {}

volumes:
  pgdata: {}
  backups: {}

services:
  db:
    # Postgres 16 + pgvector (embeddings for the agents).
    image: pgvector/pgvector:0.8.7-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: cockpit
      POSTGRES_USER: cockpit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cockpit -d cockpit"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    read_only: true
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://cockpit:${POSTGRES_PASSWORD}@db:5432/cockpit
      AUTH_MODE: ${AUTH_MODE:?set AUTH_MODE (access, or none for local development)}
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:-}
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        VITE_SOURCE_URL: ${SOURCE_URL:-}
    restart: unless-stopped
    ports:
      # Loopback only. With AUTH_MODE=access the API answers 401 here: remote
      # (and local) use goes through the tunnel and Cloudflare Access.
      - "127.0.0.1:${WEB_PORT:-8380}:8080"
    networks: [backend, edge]
    depends_on:
      api:
        condition: service_healthy

  # --- Agents: copilot, reports, rates watch (Python, LangGraph + Celery) ----

  redis:
    # Celery broker only (no business data); not persisted, internal network.
    image: redis:8.8.3-alpine
    restart: unless-stopped
    read_only: true
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  agent:
    build: &agent-build
      context: ..
      dockerfile: infra/Dockerfile.agent
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    environment: &agent-env
      AGENT_DATABASE_URL: postgresql://cockpit:${POSTGRES_PASSWORD}@db:5432/cockpit
      REDIS_URL: redis://redis:6379/0
      API_URL: http://api:3000/api
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:?set AGENT_API_TOKEN (openssl rand -hex 32)}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6.1-sol}
      OPENAI_MODEL_FAST: ${OPENAI_MODEL_FAST:-gpt-6-luna}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      AUTH_MODE: ${AUTH_MODE}
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      RATES_WATCH_CRON: ${RATES_WATCH_CRON:-0 6 * * 1}
      TZ: ${TZ:-Europe/Paris}
    networks: [backend, agent-egress]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  agent-worker:
    build: *agent-build
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    command: ["celery", "-A", "copilot.tasks", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment: *agent-env
    networks: [backend, agent-egress]
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  agent-beat:
    build: *agent-build
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    command:
      [
        "celery",
        "-A",
        "copilot.tasks",
        "beat",
        "--loglevel=INFO",
        "--schedule",
        "/tmp/celerybeat-schedule",
      ]
    environment: *agent-env
    networks: [backend]
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy

  # --- Production profile: `docker compose --profile prod up -d` -----------

  cloudflared:
    profiles: [prod]
    image: cloudflare/cloudflared:2026.9.3
    restart: unless-stopped
    read_only: true
    # Remotely managed tunnel: the public hostname → http://web:8080 route and
    # the Access application are configured in the Cloudflare dashboard.
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks: [edge]
    depends_on:
      web:
        condition: service_healthy

  backup:
    profiles: [prod]
    build:
      context: ..
      dockerfile: infra/backup/Dockerfile
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: cockpit
      PGDATABASE: cockpit
      PGPASSWORD: ${POSTGRES_PASSWORD}
      AGE_RECIPIENT: ${AGE_RECIPIENT:-}
      BACKUP_AT: ${BACKUP_AT:-03:00}
      KEEP_DAYS: ${KEEP_DAYS:-30}
      TZ: ${TZ:-Europe/Paris}
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
      # rclone remote named "remote", configured from the environment (S3-compatible).
      RCLONE_CONFIG_REMOTE_TYPE: s3
      RCLONE_CONFIG_REMOTE_PROVIDER: ${S3_PROVIDER:-Other}
      RCLONE_CONFIG_REMOTE_ENDPOINT: ${S3_ENDPOINT:-}
      RCLONE_CONFIG_REMOTE_REGION: ${S3_REGION:-auto}
      RCLONE_CONFIG_REMOTE_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_REMOTE_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_REMOTE_NO_CHECK_BUCKET: "true"
    volumes:
      - backups:/backups
    networks: [backend, egress]
    depends_on:
      db:
        condition: service_healthy
