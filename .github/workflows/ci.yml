name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  compose:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - name: Start stack
        working-directory: infra
        run: |
          printf 'POSTGRES_PASSWORD=%s\nAUTH_MODE=none\n' "$(openssl rand -hex 24)" > .env
          docker compose up -d --build --wait
          docker compose --profile prod build backup
      - name: Smoke test
        run: curl -fsS http://127.0.0.1:8380/api/health
      - name: Logs on failure
        if: failure()
        working-directory: infra
        run: docker compose logs
