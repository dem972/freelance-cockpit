name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push on the same branch / PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned by commit SHA (a tag can be moved); Dependabot updates them.
jobs:
  check:
    name: TypeScript (lint, format, types, tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  agent:
    name: Python agents (ruff, mypy --strict, pytest + pgvector)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install uv==0.9.5
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy
      - run: uv run pytest
        env:
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test

  dco:
    name: Commits signed off (DCO)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every commit has a Signed-off-by matching its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git log -1 --format='%an <%ae>' "$c")"
            if ! git log -1 --format='%B' "$c" | grep -qiF "Signed-off-by: $author"; then
              echo "::error::$(git log -1 --format='%h %s' "$c") is missing 'Signed-off-by: $author' (git commit -s)"
              missing=1
            fi
          done
          exit $missing

  compose:
    name: Docker stack smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [check, agent]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start stack
        working-directory: infra
        run: |
          printf 'POSTGRES_PASSWORD=%s\nAUTH_MODE=none\nAGENT_API_TOKEN=%s\n' "$(openssl rand -hex 24)" "$(openssl rand -hex 32)" > .env
          docker compose up -d --build --wait
          docker compose --profile prod build backup
      - name: Smoke test
        run: |
          set -e
          curl -fsS http://127.0.0.1:8380/api/health
          curl -fsS http://127.0.0.1:8380/agent/health
          # The web app is served and links to its source (AGPL §13).
          curl -fsS http://127.0.0.1:8380/ | grep -q '<div id="root">'
          # The engine answers through the API (micro-BNC, 500 €/day, 18 days, 150 € expenses).
          curl -fsS -X POST http://127.0.0.1:8380/api/simulate \
            -H 'content-type: application/json' \
            -d '{"tjm":500,"joursParMois":18,"fraisMensuels":150}' | grep -q '"statut":"micro_bnc"'
      - name: Logs on failure
        if: failure()
        working-directory: infra
        run: docker compose logs
