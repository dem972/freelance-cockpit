name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  agent:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install uv==0.9.5
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy
      - run: uv run pytest
        env:
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test

  compose:
    runs-on: ubuntu-latest
    needs: [check, agent]
    steps:
      - uses: actions/checkout@v5
      - name: Start stack
        working-directory: infra
        run: |
          printf 'POSTGRES_PASSWORD=%s\nAUTH_MODE=none\nAGENT_API_TOKEN=%s\n' "$(openssl rand -hex 24)" "$(openssl rand -hex 32)" > .env
          docker compose up -d --build --wait
          docker compose --profile prod build backup
      - name: Smoke test
        run: |
          curl -fsS http://127.0.0.1:8380/api/health
          curl -fsS http://127.0.0.1:8380/agent/health
      - name: Logs on failure
        if: failure()
        working-directory: infra
        run: docker compose logs
