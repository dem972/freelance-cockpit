name: Bug
description: Something does not work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Do not paste real personal or financial data; use made-up amounts.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        [engine / calculation, cockpit, simulator, entry, settings, copilot / agents, deployment]
